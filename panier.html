<!doctype html><html lang="fr"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panier — Mini-délices</title><link rel="stylesheet" href="assets/styles.css" /></head><body>
<header class="site-header">
  <a class="brand" href="index.html">🍪 <span>Mini-délices</span></a>
  <nav class="nav">
    <a href="catalogue.html">Catalogue</a>
    <a href="a-propos.html">À propos</a>
    <a href="faq.html">FAQ</a>
    <a class="cart-link" aria-current="page" class="cart-link" href="panier.html">Panier <span id="cartCount" class="badge">0</span></a>
  </nav>
</header>
<main><section class="section"><h1>Votre panier</h1>
<div id="cartEmpty" class="card" style="display:none;"><p>Votre panier est vide.</p><a class="btn" href="catalogue.html">Magasiner</a></div>
<div id="cartWrap" class="cart">
  <div class="card scallop"><div id="cartItems"></div></div>
  <aside class="card scallop"><h2>Résumé</h2>
    <div class="row"><span>Sous-total</span><strong id="subtotal">0,00 $</strong></div>
    <div class="row"><span>Livraison</span><strong id="shipping">0,00 $</strong></div>
    <div class="row row--total"><span>Total</span><strong id="total">0,00 $</strong></div>
    <p class="muted" style="margin-top:8px;">Taxes : à configurer selon vos obligations.</p>
    <a class="btn" href="checkout.html">Passer à la caisse</a>
    <button class="btn btn--ghost" id="clearCart">Vider le panier</button>
  </aside>
</div></section></main>
<footer class="site-footer"><p>© <span id="year"></span> Mini-délices</p></footer>
<script src="assets/products.js"></script><script src="assets/app.js"></script>
<script>
const itemsEl=document.getElementById('cartItems');
const emptyEl=document.getElementById('cartEmpty');
const wrapEl=document.getElementById('cartWrap');
const subtotalEl=document.getElementById('subtotal');
const shippingEl=document.getElementById('shipping');
const totalEl=document.getElementById('total');
function shippingCost(subtotal){ return subtotal>=65 ? 0 : (subtotal>0 ? 6.99 : 0); }
function render(){
  const lines=cartToLines(getCart());
  if(lines.length===0){ emptyEl.style.display='block'; wrapEl.style.display='none'; return; }
  emptyEl.style.display='none'; wrapEl.style.display='grid';
  itemsEl.innerHTML = lines.map(line=>`    <div class="cart-item">      <img class="thumb" src="${line.product.image}" alt="${line.product.name}" />      <div>        <div class="cart-item__top">          <div><strong>${line.product.name}</strong><div class="muted">${money(line.product.price)} / boîte</div></div>          <button class="link danger" onclick="removeItem('${line.product.id}'); render();">Retirer</button>        </div>        <div class="cart-item__bottom">          <div class="qty">            <button aria-label="Diminuer" onclick="updateQty('${line.product.id}', ${line.qty-1}); render();">−</button>            <input value="${line.qty}" inputmode="numeric" aria-label="Quantité" onchange="updateQty('${line.product.id}', parseInt(this.value||'1',10)); render();" />            <button aria-label="Augmenter" onclick="updateQty('${line.product.id}', ${line.qty+1}); render();">+</button>          </div>          <strong>${money(line.lineTotal)}</strong>        </div>      </div>    </div>  `).join('');
  const subtotal=lines.reduce((s,l)=>s+l.lineTotal,0);
  const ship=shippingCost(subtotal);
  subtotalEl.textContent=money(subtotal);
  shippingEl.textContent=money(ship);
  totalEl.textContent=money(subtotal+ship);
  setCartMeta({shipping:ship});
}
document.getElementById('clearCart').addEventListener('click', ()=>{ clearCart(); render(); });
render();
</script></body></html>
